name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # fmt, clippy and test run as parallel jobs (they cannot share build artifacts).
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Restores from this ref, else from main; saves when nothing matched.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-fmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libdrm-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Restores from this ref, else from main; saves when nothing matched.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libdrm-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable

      # Restores from this ref, else from main; saves when nothing matched.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test

      - name: cargo test
        run: cargo test --locked

  # macOS is the primary platform; verify it after merge rather than on every PR push.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked
