name: Release

# Tag pushes (v*) build all platforms and publish a GitHub Release.
# Pull requests that touch the packaging, and manual runs, run the same
# build-and-package jobs but upload only workflow artifacts (no release).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: v
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal

      - name: Build (Apple Silicon)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (Intel)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/osm-gpui \
            target/x86_64-apple-darwin/release/osm-gpui \
            -output target/universal/osm-gpui
          lipo -info target/universal/osm-gpui

      - name: Bundle and sign .app
        run: scripts/bundle-macos.sh --binary target/universal/osm-gpui --out dist

      - name: Zip
        run: |
          mkdir -p out
          ditto -c -k --keepParent dist/osm-gpui.app "out/osm-gpui-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: out/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage, out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/osm-gpui.exe stage/
          Copy-Item README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "out/osm-gpui-$env:VERSION-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: out/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libdrm-dev libgbm-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      # Regression check for a gpui build with no windowing backend, which
      # panics at startup with "internal error: entered unreachable code".
      # Runners have no GPU, so the app may well exit for unrelated reasons
      # (no Vulkan adapter, ...); only that specific panic fails the job.
      - name: Smoke test (windowing backend present)
        run: |
          set +e
          timeout 15 xvfb-run -a target/x86_64-unknown-linux-gnu/release/osm-gpui > smoke.log 2>&1
          echo "exit status: $?"
          cat smoke.log
          if grep -q "entered unreachable code" smoke.log; then
            echo "::error::osm-gpui panicked at startup (no windowing backend compiled in?)"
            exit 1
          fi
          exit 0

      - name: Package
        run: |
          name="osm-gpui-${VERSION}-linux-x86_64"
          mkdir -p "stage/$name" out
          cp target/x86_64-unknown-linux-gnu/release/osm-gpui "stage/$name/"
          cp packaging/linux/osm-gpui.desktop README.md "stage/$name/"
          mkdir -p "stage/$name/share/mime/packages"
          cp packaging/linux/osm-gpui.xml "stage/$name/share/mime/packages/"
          cp assets/AppIcon.png "stage/$name/osm-gpui.png"
          tar -C stage -czf "out/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: |
          sha256sum * | tee SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: packages/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Use the matching "## X.Y.Z" section of CHANGELOG.md as the release
          # body; fall back to GitHub's generated notes if there is none.
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="${TAG#v}" '
            /^## / { if (found) exit; if ($2 == v) found = 1; next }
            found
          ' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            echo "No CHANGELOG.md section for ${TAG#v}; using generated notes"
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            "${notes_args[@]}" \
            --verify-tag
