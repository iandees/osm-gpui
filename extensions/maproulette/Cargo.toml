[package]
name = "maproulette"
version = "0.2.0"
edition = "2021"
publish = false

# An extension builds on its own, for wasm32-wasip2.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
osm-gpui-extension-api = { path = "../../crates/osm-gpui-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
