name = "Mapillary"
description = "Street-level photos from Mapillary on the map, with the photo and its details in the side panel. Needs a Mapillary access token."

[commands]
photos = "Mapillary Photos"

[photos]
zoom_in = "Zoom in to see Mapillary photos"
loaded_one = "Mapillary: 1 photo"
loaded = "Mapillary: %{count} photos"
no_token = "Add a Mapillary access token in Settings > Extensions > Mapillary to see Mapillary photos"
unauthorized = "Mapillary refused the access token; check it in Settings > Extensions > Mapillary"
rate_limited = "Mapillary rate limit reached; try again later"
failed = "Could not load Mapillary photos: %{detail}"

[photo]
title = "Mapillary Photo"
no_picture = "This photo has no picture to show"
captured = "Taken %{date}"
by = "by %{creator}"
license = "License: %{license}"
heading = "Facing %{degrees}°"
open_site = "Open on %{provider}"

[token]
title = "Mapillary Access Token"
explain = "Mapillary photos need an access token: a client token from your Mapillary developer dashboard. It is kept in your system keychain and sent only to Mapillary."
find = "Get a client token from Mapillary"
label = "Access token"
placeholder = "Paste your client token (MLY|…)"
placeholder_replace = "A token is saved; paste a new one to replace it"
save = "Save"
forget = "Forget Token"
saved = "Mapillary: access token saved"
forgotten = "Mapillary: access token forgotten"
