[package]
name = "osm-gpui-extension-api"
version = "0.2.0"
edition = "2021"
description = "Write osm-gpui extensions in Rust"
license = "MIT"
repository = "https://github.com/iandees/osm-gpui"
readme = "README.md"

# Built for wasm32-wasip2 by each extension, never as part of the app.
[workspace]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
