[package]
name = "osm-gpui"
version = "0.6.0"
edition = "2021"
description = "A high-performance map rendering system built with Rust and the GPUI framework"
license = "MIT"
repository = "https://github.com/iandees/osm-gpui"
homepage = "https://github.com/iandees/osm-gpui"
documentation = "https://docs.rs/osm-gpui"
keywords = ["maps", "geospatial", "gis", "gpui", "openstreetmap"]
categories = ["graphics", "visualization", "gui"]
authors = ["Ian Dees <me@iandees.com>"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "test-support"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
image = "0.25"
# Default "v1" feature pulls in the platform-native credential store backend
# (Keychain on macOS, Credential Manager on Windows, Secret Service on *nix).
keyring = "4.1"
open = "5"
quick-xml = "0.37"
rand = "0.8"
rfd = "0.15"
rstar = "0.13"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
smallvec = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2"
futures = "0.3"
earcutr = "0.4"
rust-i18n = "4.1"
sys-locale = "0.3.2"

# gpui_linux is pulled in with default-features = false, so without these two
# features no windowing backend is compiled in and gpui panics at startup
# (`unreachable!()` in gpui_linux::current_platform). Same package/rev as the
# dependency above; cargo merges the features for Linux/FreeBSD builds only.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["wayland", "x11"] }

# Same objc 0.2.7 gpui_macos uses; sets NSApplication.appearance so the native
# title bar and other system chrome follow the app's theme.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[dev-dependencies]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "osm-gpui"
path = "src/main.rs"

# Debug builds of this crate hit ~40ms/frame in OsmLayer's canvas paint alone
# (measured on an 8k-node/4k-way dataset) vs ~2ms/frame in release — an ~18x
# gap driven by unoptimized per-frame numeric code (trig, hashmap lookups,
# vector math). opt-level 1 for our own code plus opt-level 3 for
# dependencies (compiled once, then cached) keeps incremental rebuilds fast
# while making `cargo run` usable for interactive testing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
