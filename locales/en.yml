# Errors from the OSM API and OAuth code, shown in the status bar and the
# Settings window. `%{detail}` is the server's or network layer's own
# message, which is not translated.
# Splitting a large upload into several changesets.
upload_chunks:
  cycle_too_large: "%{size} new relations contain each other and must be uploaded together, but the server allows only %{max} changes in one changeset. Break the cycle before uploading."

# What the server's refusal of an upload means, in plain words, and what
# resolving it does. `%{object}` is "Node 12345" / "Way 5" / "Relation 7" (or
# `something` when the server names none).
upload_conflict:
  node: "Node %{id}"
  way: "Way %{id}"
  relation: "Relation %{id}"
  something: "An object you edited"
  version_mismatch: "%{object} was changed on the server since you downloaded it (your version %{provided}, server version %{server})"
  already_deleted: "%{object} has already been deleted on the server"
  still_in_use: "%{object} can't be deleted because it is still used by %{by}"
  still_in_use_unknown: "%{object} can't be deleted because something still uses it"
  missing_dependency: "%{object} refers to something that doesn't exist on the server or has been deleted there"
  other: "The server refused the upload (%{status}): %{detail}"
  not_found: "%{object} is no longer in the loaded data"
  keep_gone: "%{object} was deleted on the server, so your version can't replace it. Use theirs removes it here."
  kept_mine: "Kept your version of %{object}. Press Upload to send it."
  used_theirs: "Replaced %{object} with the server's version; your change to it is gone. Press Upload to continue."
  dropped: "Forgot your delete of %{object}, which the server had already done. Press Upload to continue."
  undo_trimmed: "Undo steps that involved it were removed."

