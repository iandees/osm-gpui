  deleted_way: "Deleted 1 way"
  created_way: "Created 1 way"
  created_relation: "Created a relation"
  deleted_relation: "Deleted a relation"
  extended_way: "Extended a way"
  created_building: "Created a building"
  extruded_way: "Extruded a way"
  inserted_node: "Inserted a node into a way"
  snapped_node: "Snapped a node onto a way"
  changed_way_nodes: "Changed the nodes of a way"
  changed_relation_members: "Changed the members of a relation"

