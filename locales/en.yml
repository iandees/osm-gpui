_version: 1

# English message catalog (the source language and the fallback for every
# other catalog). Keys are grouped by area; `%{name}` marks a placeholder.
# Plural messages have one key per plural category (`one`, `other`, ...).

meta:
  # Shown in the Settings language dropdown, in the language itself.
  language_name: "English"

menu:
  app:
    about: "About %{app}"
    settings: "Settings…"
    services: "Services"
    hide: "Hide %{app}"
    hide_others: "Hide Others"
    show_all: "Show All"
    quit: "Quit %{app}"
  file:
    title: "File"
    open: "Open…"
    export: "Export…"
    download: "Download from OSM"
    upload: "Upload to OSM…"
  edit:
    title: "Edit"
    undo: "Undo"
    redo: "Redo"
    copy_tags: "Copy Tags"
    paste_tags: "Paste Tags"
    delete: "Delete"
    select_all: "Select All"
    deselect_all: "Deselect All"
    change_feature_type: "Change Feature Type…"
    apply_nsi_preset: "Apply NSI Preset…"
  tools:
    title: "Tools"
  mode:
    title: "Mode"
  imagery:
    title: "Imagery"
    custom: "Custom Imagery"
    custom_add: "Add…"
    osm_carto: "OpenStreetMap Carto"
    coordinate_grid: "Coordinate Grid"
    loading: "(Loading imagery index…)"
    unavailable: "(Imagery index unavailable)"
    # A recommended imagery source in the menu.
    best_entry: "★ %{name}"
  view:
    title: "View"
    zoom_in: "Zoom In"
    zoom_out: "Zoom Out"
    zoom_to_data: "Zoom to Data"
    zoom_to_selection: "Zoom to Selection"
    toggle_debug_overlay: "Toggle Debug Overlay"
  window:
    title: "Window"
    minimize: "Minimize"
    zoom: "Zoom"
  help:
    title: "Help"
    map_features_wiki: "OpenStreetMap Wiki: Map Features"
    project_page: "%{app} on GitHub"
  open_dialog:
    title: "Select OSM file to open"
    osm_files: "OSM files"
    all_files: "All files"
  export_dialog:
    title: "Export OSM data"

# Edit modes. `name` is the menu item, `label` the short text under the
# toolbar icon (the toolbar is narrow), `tooltip` the hover description.
mode:
  select:
    name: "Select"
    label: "Select"
    tooltip: "Select and move features"
  add:
    name: "Add"
    label: "Add"
    tooltip: "Add nodes and ways"
  building:
    name: "Building"
    label: "Bldg"
    tooltip: "Draw a rectangular building"
  extrude:
    name: "Extrude"
    label: "Extr"
    tooltip: "Extrude a way segment"
  # `%{shortcut}` is the key that activates the mode, e.g. "A".
  tooltip: "%{name} (%{shortcut})"
  tooltip_disabled: "%{name} (%{shortcut}) — open or download OSM data first"

# Long-running network transfers, shown with a spinner in the status bar (and,
# for uploads, in the upload dialog).
transfer:
  # `%{size}` and `%{total}` are byte counts such as "1.4 MB".
  download:
    requesting: "Requesting OSM data…"
    downloading: "Downloading OSM data…"
    downloading_bytes: "Downloading OSM data… %{size}"
    downloading_total: "Downloading OSM data… %{size} of %{total}"
    reading: "Reading OSM data…"
    cancel: "Cancel"
    cancelled: "Download cancelled"
  upload:
    opening: "Opening changeset…"
    uploading:
      one: "Uploading %{count} change…"
      other: "Uploading %{count} changes…"
    closing: "Closing changeset…"
  busy: "Another transfer is already in progress"

# The card over the map while no OSM data is loaded.
welcome:
  title: "Welcome to osm-gpui"
  body: "Pan and zoom to the area you want to edit, then download its OpenStreetMap data. Or open an .osm file."
  download: "Download OSM data here"
  downloading: "Downloading…"
  # Shown in place of the download button while the view covers too large an area.
  zoom_in: "Zoom in to download"
  open: "Open file…"

status:
  # One-line hint for what the mouse and keyboard do in each mode.
  hint:
    select_empty: "Click to select · Shift-click to add to the selection · drag to box-select · Space-drag or right-drag to pan"
    select_selection: "Drag the selection to move it · Delete to remove · Esc to deselect"
    select_relation: "Relation selected: its members are highlighted · Esc to deselect"
    add_idle: "Click to place a node or start a way · Ctrl-click to place without snapping · Esc to exit"
    add_started: "Click to continue the way · Enter or Esc to finish"
    building_idle: "Click to place the building's first corner · Esc to exit"
    building_started: "Click to place the second corner · Esc to cancel"
    building_edge_placed: "Move to set the depth, then click to finish · Esc to cancel"
    building_oriented_idle: "Click or drag to draw a building aligned to the selected way · Esc to exit"
    building_oriented_started: "Click or release at the opposite corner to finish the building · Esc to cancel"
    extrude: "Drag a way segment to extrude it · double-click a segment to add a node · Esc to exit"
  pending_edits:
    one: "%{count} unsaved edit"
    other: "%{count} unsaved edits"
  not_signed_in: "Not signed in"
  zoom_in_to_download: "Zoom in to download"
  api_offline: "The OSM API reports it is offline; try again later"
  open_failed: "Could not open %{path}: %{error}"
  open_data_first: "Open or download OSM data before drawing"
  tag_needs_key: "A tag needs a key; the edit was discarded"
  # Removing a member from a relation was refused.
  member_remove:
    last: "Can't remove the last member of relation %{relation}"
    restriction_role: "Can't remove it: turn restriction %{relation} would be left without a '%{role}' member"
  nothing_to_delete: "Nothing to delete"
  deleted_features:
    one: "Deleted %{count} feature"
    other: "Deleted %{count} features"
  deleted_relations:
    one: "Deleted %{count} relation"
    other: "Deleted %{count} relations"
  # `%{relations}` is the relation count from `action.relation_count`.
  deleted_features_in_relations:
    one: "Deleted %{count} feature and removed it from %{relations}"
    other: "Deleted %{count} features and removed them from %{relations}"
  # A delete that skipped some features: what was done, then why the rest wasn't.
  delete_skipped: "%{done}; %{reason}"
  no_data_to_zoom: "No OSM data to zoom to"
  nothing_selected: "Nothing selected"
  no_data_to_export: "No OSM data to export"
  exported: "Exported to %{path}"
  export_failed: "Export failed: %{error}"
  nothing_to_upload: "Nothing to upload"
  uploaded: "Uploaded changes (changeset %{changeset})"
  upload_failed_changeset_open: "%{error} (changeset %{changeset} was opened but not uploaded — you may want to close it manually)"
  downloaded: "Downloaded OSM data: %{summary}"
  # The parts of the download summary above, joined with `separator`.
  merge:
    nothing_new: "nothing new"
    added:
      one: "%{count} new"
      other: "%{count} new"
    updated:
      one: "%{count} updated"
      other: "%{count} updated"
    kept_local:
      one: "%{count} local edit kept"
      other: "%{count} local edits kept"
    separator: ", "

# The OSM server's size limits (way nodes, relation members, elements per
# changeset). Counts arrive already formatted with digit grouping.
limits:
  upload:
    way: "Way %{id} has %{nodes} nodes; the server allows %{max}. Split it before uploading."
    relation: "Relation %{id} has %{members} members; the server allows %{max}. Remove some members before uploading."
    changeset: "This upload has %{count} changes; the server allows %{max} in one changeset. Upload fewer changes at a time."
  edit:
    way_full: "A way can have at most %{max} nodes on this server"
    join: "Can't join: the combined way would have %{nodes} nodes; the server allows %{max}"
    relation_add: "Can't add to the relation: it would have %{members} members; the server allows %{max}"
    relation_new: "Can't create the relation: %{members} members is more than the server allows (%{max})"

# Side panel sections. Preset and field labels shown inside them come from
# the bundled iD tagging schema and are not translated here.
panel:
  layers:
    title: "Layers"
    empty: "No layers yet"
    # Badge on the layer that drawing modes write into.
    editing: "editing"
    set_active: "Set as active layer"
    move_up: "Move up"
    move_down: "Move down"
    hide: "Hide"
    show: "Show"
    delete: "Delete"
  selection:
    title: "Selection"
    title_count:
      one: "Selection (%{count} item)"
      other: "Selection (%{count} items)"
    nothing: "Nothing selected"
    nothing_hint: "Click a feature, or drag a box to select several."
    node: "Node"
    way: "Way"
    relation: "Relation"
    # `%{kind}` is the Node/Way/Relation label above, `%{id}` the OSM id.
    row: "%{kind} %{id}"
    row_named: "%{name} · %{kind} %{id}"
  fields:
    title: "Fields"
    change_type: "Change feature type…"
    no_preset: "No matched preset."
    no_fields: "This feature type has no editable fields."
    add_field: "Add field (%{count})"
    # Opens the value list of a multi-select field.
    multi_add: "+ Add"
    # Shown in a dropdown field with no value set.
    none: "(none)"
  tags:
    title: "Tags"
    add: "Add tag"
    empty: "(no tags)"
    key_placeholder: "key"
    value_placeholder: "value"
  relations:
    title: "Relations"
    no_role: "(no role)"
    remove: "Remove from this relation"
    # A member that is in the relation but not in the loaded data.
    not_downloaded: "%{kind} %{id} (not downloaded)"
  members:
    title_count:
      one: "Members (%{count})"
      other: "Members (%{count})"
    empty: "(no members)"
    # Placeholder in the role input.
    role: "role"
    move_up: "Move up"
    move_down: "Move down"
    remove: "Remove from relation"
    show_all: "Show all %{count}"
  history:
    title: "History"
    empty: "No actions yet."

# Undo history entries.
history:
  moved_nodes:
    one: "Moved %{count} node"
    other: "Moved %{count} nodes"
  changed_tags:
    one: "Changed %{count} tag"
    other: "Changed %{count} tags"
  created_node: "Created 1 node"
