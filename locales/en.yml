_version: 1

# English message catalog (the source language and the fallback for every
# other catalog). Keys are grouped by area; `%{name}` marks a placeholder.
# Plural messages have one key per plural category (`one`, `other`, ...).

meta:
  # Shown in the Settings language dropdown, in the language itself.
  language_name: "English"

menu:
  app:
    about: "About %{app}"
    settings: "Settings…"
    services: "Services"
    hide: "Hide %{app}"
    hide_others: "Hide Others"
    show_all: "Show All"
    quit: "Quit %{app}"
  file:
    title: "File"
    open: "Open…"
    export: "Export…"
    download: "Download from OSM"
    upload: "Upload to OSM…"
  edit:
    title: "Edit"
    undo: "Undo"
    redo: "Redo"
    copy_features: "Copy"
    paste_features: "Paste"
    paste_features_source: "Paste at Source Position"
    duplicate_features: "Duplicate"
    copy_tags: "Copy Tags"
    paste_tags: "Paste Tags"
    delete: "Delete"
    select_all: "Select All"
    deselect_all: "Deselect All"
    find: "Find…"
    show_history: "Show Object History"
    change_feature_type: "Change Feature Type…"
    apply_nsi_preset: "Apply NSI Preset…"
  tools:
    title: "Tools"
  mode:
    title: "Mode"
  # Submenu that takes the entries of a menu too long for the in-window menu
  # bar (Windows and Linux).
  more: "More"
  imagery:
    title: "Imagery"
    # The long list of imagery sources for the area, as a submenu.
    available: "Available Imagery"
    custom: "Custom Imagery"
    custom_add: "Add…"
    osm_carto: "OpenStreetMap Carto"
    coordinate_grid: "Coordinate Grid"
    loading: "(Loading imagery index…)"
    unavailable: "(Imagery index unavailable)"
    # A recommended imagery source in the menu.
    best_entry: "★ %{name}"
    adjust_offset: "Adjust Imagery Offset"
    reset_offset: "Reset Imagery Offset"
  view:
    title: "View"
    zoom_in: "Zoom In"
    zoom_out: "Zoom Out"
    zoom_to_data: "Zoom to Data"
    zoom_to_selection: "Zoom to Selection"
    show_downloaded_area: "Show Downloaded Area"
    toggle_debug_overlay: "Toggle Debug Overlay"
  window:
    title: "Window"
    minimize: "Minimize"
    zoom: "Zoom"
  help:
    title: "Help"
    map_features_wiki: "OpenStreetMap Wiki: Map Features"
    project_page: "%{app} on GitHub"
  open_dialog:
    title: "Select a file to open"
    map_files: "OSM, GPX and GeoJSON files"
    osm_files: "OSM files"
    all_files: "All files"
  export_dialog:
    title: "Export OSM data"

# Edit modes. `name` is the menu item, `label` the short text under the
# toolbar icon (the toolbar is narrow), `tooltip` the hover description.
mode:
  select:
    name: "Select"
    label: "Select"
    tooltip: "Select and move features"
  add:
    name: "Add"
    label: "Add"
    tooltip: "Add nodes and ways"
  building:
    name: "Building"
    label: "Bldg"
    tooltip: "Draw a rectangular building"
  extrude:
    name: "Extrude"
    label: "Extr"
    tooltip: "Extrude a way segment"
  arc:
    name: "Arc"
    label: "Arc"
    tooltip: "Draw a circular arc"
  improve:
    name: "Improve Way"
    label: "Impr"
    tooltip: "Improve the shape of the selected way"
  # `%{shortcut}` is the key that activates the mode, e.g. "A".
  tooltip: "%{name} (%{shortcut})"
  tooltip_disabled: "%{name} (%{shortcut}) — open or download OSM data first"

# Long-running network transfers, shown with a spinner in the status bar (and,
# for uploads, in the upload dialog).
transfer:
  # `%{size}` and `%{total}` are byte counts such as "1.4 MB".
  download:
    requesting: "Requesting OSM data…"
    downloading: "Downloading OSM data…"
    downloading_bytes: "Downloading OSM data… %{size}"
    downloading_total: "Downloading OSM data… %{size} of %{total}"
    reading: "Reading OSM data…"
    cancel: "Cancel"
    cancelled: "Download cancelled"
  upload:
    opening: "Opening changeset…"
    uploading:
      one: "Uploading %{count} change…"
      other: "Uploading %{count} changes…"
    closing: "Closing changeset…"
    # An upload too big for one changeset is sent as several. `%{index}` of
    # `%{total}` says which; `%{changes}` is the count with digit grouping.
    part_opening: "Changeset %{index} of %{total}: opening…"
    part_uploading:
      one: "Changeset %{index} of %{total}: uploading %{changes} change…"
      other: "Changeset %{index} of %{total}: uploading %{changes} changes…"
    part_closing: "Changeset %{index} of %{total}: closing…"
  busy: "Another transfer is already in progress"
  # Shown while the app waits on the system keychain's access prompt for the saved login.
  waiting_keychain: "Waiting for access to your saved login… (check for a keychain prompt)"

# The panel over the map while adjusting an imagery layer's offset. Values
# are ground metres east and north, with two decimals.
imagery_offset:
  title: "Adjust imagery offset"
  value: "E %{east} m, N %{north} m"
  east: "East"
  north: "North"
  metres: "m"
  hint: "Drag the map to move the imagery. Arrow keys nudge by 1 px (Shift: 10 px). Esc cancels."
  reset: "Reset"
  done: "Done"
  no_layer: "There is no visible imagery layer to adjust"
  reset_done: "Imagery offset reset"

# The card over the map while no OSM data is loaded.
welcome:
  title: "Welcome to osm-gpui"
  body: "Pan and zoom to the area you want to edit, then download its OpenStreetMap data. Or open an .osm file."
  download: "Download OSM data here"
  downloading: "Downloading…"
  # Shown in place of the download button while the view covers too large an area.
  zoom_in: "Zoom in to download"
  open: "Open file…"
  # Tooltip of the close button; the card stays hidden until turned back on in Settings.
  dismiss: "Don't show this again (can be turned back on in Settings)"

status:
  # One-line hint for what the mouse and keyboard do in each mode.
  hint:
    select_empty: "Click to select · Shift-click to add · drag to box-select · Space-drag to pan"
    select_selection: "Drag the selection to move it (a single node snaps onto ways and nodes; hold Alt to not snap) · Delete to remove · Esc to deselect"
    select_relation: "Relation selected: its members are highlighted · Esc to deselect"
    select_member_way: "Drag to move · Delete to remove · Esc to deselect · pick its relation in the side panel"
    add_idle: "Click to place a node or start a way · hold Alt to place without snapping · Esc to exit"
    add_started: "Click to continue the way (snaps onto ways and nodes; hold Alt to not snap) · Enter or Esc to finish"
    building_idle: "Click to place the building's first corner · Esc to exit"
    building_started: "Click to place the second corner · Esc to cancel"
    building_edge_placed: "Move to set the depth, then click to finish · Esc to cancel"
    building_oriented_idle: "Click or drag to draw a building aligned to the selected way · Esc to exit"
    building_oriented_started: "Click or release at the opposite corner to finish · Esc to cancel"
    extrude: "Drag to reshape · Alt-drag for a new way · Cmd/Ctrl-drag to move · Esc to exit"
    arc_idle: "Click to place the arc's start · Esc to exit"
    arc_started: "Click to place the arc's end · Esc to cancel"
    arc_end_placed: "Move to bend the arc, then click to finish · Esc to cancel"
    improve_idle: "Click a way to improve · Esc to exit"
    improve_way_chosen: "Click to move the nearest node · Cmd/Ctrl/Alt-click to add a node · Shift-click to delete the nearest node · Esc to pick another way"
    adjust_offset: "Drag to move the imagery · arrow keys nudge (Shift for 10 px) · Space-drag to pan · Enter to keep · Esc to cancel"
  pending_edits:
    one: "%{count} unsaved edit"
    other: "%{count} unsaved edits"
  not_signed_in: "Not signed in"
  zoom_in_to_download: "Zoom in to download"
  api_offline: "The OSM API reports it is offline; try again later"
  open_failed: "Could not open %{path}: %{error}"
  opening: "Opening %{name}…"
  open_data_first: "Open or download OSM data before drawing"
  tag_needs_key: "A tag needs a key; the edit was discarded"
  # Removing a member from a relation was refused.
  member_remove:
    last: "Can't remove the last member of relation %{relation}"
    restriction_role: "Can't remove it: turn restriction %{relation} would be left without a '%{role}' member"
  nothing_to_delete: "Nothing to delete"
  deleted_features:
    one: "Deleted %{count} feature"
    other: "Deleted %{count} features"
  deleted_relations:
    one: "Deleted %{count} relation"
    other: "Deleted %{count} relations"
  # `%{relations}` is the relation count from `action.relation_count`.
  deleted_features_in_relations:
    one: "Deleted %{count} feature and removed it from %{relations}"
    other: "Deleted %{count} features and removed them from %{relations}"
  # A delete that skipped some features: what was done, then why the rest wasn't.
  delete_skipped: "%{done}; %{reason}"
  no_data_to_zoom: "No OSM data to zoom to"
  nothing_selected: "Nothing selected"
  find_no_layer: "There is no data layer to search"
  find_no_matches: "No matches"
  find_selected:
    one: "%{count} feature selected"
    other: "%{count} features selected"
  no_data_to_export: "No OSM data to export"
  exported: "Exported to %{path}"
  export_failed: "Export failed: %{error}"
  nothing_to_upload: "Nothing to upload"
  uploaded: "Uploaded changes (changeset %{changeset})"
  upload_blocks_edits: "An upload is in progress. Wait for it to finish before editing."
  upload_blocks_quit: "An upload is in progress. Wait for it to finish before quitting."
  history_step_skipped: "That step belongs to a layer that no longer exists, so it was skipped."
  # Sent as several changesets; `%{changeset}` is the last one.
  uploaded_many:
    one: "Uploaded changes in %{count} changeset (last: changeset %{changeset})"
    other: "Uploaded changes in %{count} changesets (last: changeset %{changeset})"
  # After restoring autosaved layers at startup.
  restored_autosave:
    one: "Restored %{count} layer with unsaved edits"
    other: "Restored %{count} layers with unsaved edits"
  # At startup, when a newer version of the app left autosaved edits behind.
  autosave_newer_version: "A newer version of this app left autosaved edits that this version cannot restore. They were kept; open that version to recover them."
  # `%{layer}` is the layer's name, `%{error}` the reason.
  restore_failed: "Could not restore \"%{layer}\": %{error}"
  downloaded: "Downloaded OSM data: %{summary}"
  # The parts of the download summary above, joined with `separator`.
  merge:
    nothing_new: "nothing new"
    added:
      one: "%{count} new"
      other: "%{count} new"
    updated:
      one: "%{count} updated"
      other: "%{count} updated"
    kept_local:
      one: "%{count} local edit kept"
      other: "%{count} local edits kept"
    separator: ", "

# The OSM server's size limits (way nodes, relation members, elements per
# changeset). Counts arrive already formatted with digit grouping.
limits:
  upload:
    way: "Way %{id} has %{nodes} nodes; the server allows %{max}. Split it before uploading."
    relation: "Relation %{id} has %{members} members; the server allows %{max}. Remove some members before uploading."
  edit:
    way_full: "A way can have at most %{max} nodes on this server"
    join: "Can't join: the combined way would have %{nodes} nodes; the server allows %{max}"
    relation_add: "Can't add to the relation: it would have %{members} members; the server allows %{max}"
    relation_new: "Can't create the relation: %{members} members is more than the server allows (%{max})"
    paste_way: "Can't paste: a copied way has %{nodes} nodes; the server allows %{max}"
    paste_relation: "Can't paste: a copied relation has %{members} members; the server allows %{max}"

# Side panel sections. Preset and field labels shown inside them come from
# the bundled iD tagging schema and are not translated here.
panel:
  layers:
    title: "Layers"
    empty: "No layers yet"
    # Badge on the layer that drawing modes write into.
    editing: "editing"
    set_active: "Set as active layer"
    move_up: "Move up"
    move_down: "Move down"
    hide: "Hide"
    show: "Show"
    delete: "Delete"
    adjust_offset: "Adjust imagery offset"
    reset_offset: "Reset imagery offset"
    # Tag on an imagery layer that is drawn shifted; the values are metres.
    offset_tag: "offset E %{east}, N %{north}"
  selection:
    title: "Selection"
    title_count:
      one: "Selection (%{count} item)"
      other: "Selection (%{count} items)"
    nothing: "Nothing selected"
    nothing_hint: "Click a feature, or drag a box to select several."
    node: "Node"
    way: "Way"
    relation: "Relation"
    # `%{kind}` is the Node/Way/Relation label above, `%{id}` the OSM id.
    row: "%{kind} %{id}"
    row_named: "%{name} · %{kind} %{id}"
    # A very large selection lists only its first `%{shown}` features;
    # `%{count}` is how many are left out.
    more:
      one: "…and %{count} more (first %{shown} listed)"
      other: "…and %{count} more (first %{shown} listed)"
  fields:
    title: "Fields"
    change_type: "Change feature type…"
    no_preset: "No matched preset."
    no_fields: "This feature type has no editable fields."
    add_field: "Add field (%{count})"
    # Opens the value list of a multi-select field.
    multi_add: "+ Add"
    # Shown in a dropdown field with no value set.
    none: "(none)"
  tags:
    title: "Tags"
    add: "Add tag"
    empty: "(no tags)"
    # More than `%{limit}` features selected: their tags are not combined.
    too_many:
      one: "%{count} feature selected: too many to show combined tags (limit %{limit})"
      other: "%{count} features selected: too many to show combined tags (limit %{limit})"
    key_placeholder: "key"
    value_placeholder: "value"
  relations:
    title: "Relations"
    no_role: "(no role)"
    remove: "Remove from this relation"
    # A member that is in the relation but not in the loaded data.
    not_downloaded: "%{kind} %{id} (not downloaded)"
  members:
    title_count:
      one: "Members (%{count})"
      other: "Members (%{count})"
    empty: "(no members)"
    # Placeholder in the role input.
    role: "role"
    sort: "Sort members"
    sort_hint: "Put the ways into connected order; other members and all roles stay as they are"
    move_up: "Move up"
    move_down: "Move down"
    remove: "Remove from relation"
    show_all: "Show all %{count}"
  history:
    title: "History"
    empty: "No actions yet."
    steps:
      one: "%{count} step"
      other: "%{count} steps"

# Undo history entries.
history:
  moved_nodes:
    one: "Moved %{count} node"
    other: "Moved %{count} nodes"
  changed_tags:
    one: "Changed %{count} tag"
    other: "Changed %{count} tags"
  created_node: "Created 1 node"
  deleted_node: "Deleted 1 node"
  deleted_way: "Deleted 1 way"
  created_way: "Created 1 way"
  created_relation: "Created a relation"
  deleted_relation: "Deleted a relation"
