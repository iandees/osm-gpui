  close: "Close"
  retry: "Retry"
  open_web: "Open on openstreetmap.org"
  unsaved: "Your unsaved changes"
  version: "Version %{version}"
  deleted: "Deleted"
  unknown_user: "unknown user"
  changeset: "changeset %{id}"
  no_changes: "No tag, geometry or member changes"
  unchanged_tags:
