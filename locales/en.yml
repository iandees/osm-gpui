    # Stopped part way: `%{done}` of `%{total}` changesets are on the server.
    partial: "%{done} of %{total} changesets were uploaded; the rest of your changes are still pending."
    # Ways forward when the server refuses the upload (see `upload_conflict`).
    conflict:
      keep_mine: "Keep mine"
