# Selection actions (`selection_actions::ACTIONS`): the right-click context
# menu, the Tools menu, and their status-bar messages. Each action id has a
# `label` (menu item) and a `hint` (shown when the selection doesn't fit).
action:
  no_data: "Open or download OSM data first"
  not_editable: "The active layer is not editable"
  square:
    label: "Square"
    hint: "Select a closed way (or a way with 3+ nodes) to square it"
    none: "No corners are close enough to 90° to square"
    done:
      one: "Squared %{count} way"
      other: "Squared %{count} ways"
  circularize:
    label: "Circularize"
    hint: "Select a closed way to circularize it"
    done:
      one: "Circularized %{count} way"
      other: "Circularized %{count} ways"
  reverse:
    label: "Reverse Way"
    hint: "Select a way to reverse it"
    done:
      one: "Reversed %{count} way"
      other: "Reversed %{count} ways"
  join:
    label: "Join Ways"
    hint: "Select two or more ways that connect end to end to join them"
    done:
      one: "Joined %{count} way"
      other: "Joined %{count} ways"
    error:
      not_chainable: "Can't join: the ways don't connect end to end in one chain"
      tag_conflict: "Can't join: the ways have different values for '%{key}'"
      needs_reversal: "Can't join: way %{id} would have to be reversed but its tags depend on its direction"
      restriction: "Can't join: way %{way} is part of turn restriction %{relation}"
      role_mismatch: "Can't join: way %{way} has a different role in relation %{relation} than the way it would be joined into"
  separate:
    label: "Separate Node"
    hint: "Select a node shared by two or more ways to separate it"
    node_missing: "The selected node is not in the active layer"
    done:
      one: "Separated a node into %{count} copy"
      other: "Separated a node into %{count} copies"
  extend:
    label: "Extend Way"
    hint: "Select an open way, or the end node of one, to continue drawing it"
    started: "Click to add nodes to the way; Enter or Esc to finish"
  # Plural pieces of the Copy/Paste Tags status messages.
  tag_count:
    one: "%{count} tag"
    other: "%{count} tags"
  feature_count:
    one: "%{count} feature"
    other: "%{count} features"
  relation_count:
    one: "%{count} relation"
    other: "%{count} relations"
  copy_tags:
    label: "Copy Tags"
    hint: "Select one feature that has tags to copy them"
    done: "Copied %{tags}"
  paste_tags:
    label: "Paste Tags"
    hint: "Copy a feature's tags first, then select what to paste them onto"
    none: "The selected features already have the copied tags"
    done: "Pasted %{tags} onto %{features}"
  split:
    label: "Split Way"
    hint: "Select a node inside a way (or two nodes of a closed way) to split it"
    done:
      one: "Split %{count} way"
      other: "Split %{count} ways"
    error:
      restriction_via: "Can't split: can't tell which part of way %{way} belongs in turn restriction %{relation}"
  merge:
    label: "Merge Nodes"
    hint: "Select two or more nodes to merge them into one"
    done:
      one: "Merged %{count} node"
      other: "Merged %{count} nodes"
    error:
      tag_conflict: "Can't merge: the nodes have different values for '%{key}'"
      degenerate_way: "Can't merge: way %{id} would be left with fewer than two distinct nodes"
  straighten:
    label: "Straighten Way"
    hint: "Select an open way with 3 or more nodes to straighten it"
    none: "The selected ways are already straight"
    done:
      one: "Straightened %{count} way"
      other: "Straightened %{count} ways"
    error:
      too_curved: "Can't straighten: the way bends more than %{percent}% of its length"
      no_line: "Can't straighten: the way's first and last node are in the same place"
  add_to_relation:
    label: "Add to Relation…"
    hint: "Select nodes or ways in a layer that has relations to add them to one"
    # `%{features}` is the count from `action.feature_count`.
    done: "Added %{features} to relation %{relation}"
    already: "The selected features are already members of %{relation}"
  new_relation:
    label: "New Relation"
    hint: "Select nodes, ways or relations to put into a new relation"
    # `%{members}` is the count from `action.feature_count`.
    done: "Created a relation with %{members}. Add its tags and roles in the side panel"
  delete:
    label: "Delete"
    hint: "Select something to delete"
    # `%{what}` is the kind below, `%{id}` the OSM id.
    kind:
      node: "node"
      way: "way"
    error:
      relation_in_relation: "Can't delete relation %{relation}: it is a member of relation %{parent}"
      relation_empty: "Can't delete %{what} %{id}: it is the only member of relation %{relation}"
      restriction_role: "Can't delete %{what} %{id}: turn restriction %{relation} would be left without a '%{role}' member"

