    other: "%{count} nodes added"
  nodes_removed:
    one: "%{count} node removed"
    other: "%{count} nodes removed"
  nodes_reordered: "Nodes reordered"
  members_count: "Members: %{before} → %{after}"
  members_changed: "Members or roles changed"
  redacted:
    one: "Version %{range} is hidden (redacted)"
    other: "Versions %{range} are hidden (redacted)"
  show_more:
    one: "Show more (%{count} older version)"
    other: "Show more (%{count} older versions)"
  revert_tags: "Revert tags to this version"
