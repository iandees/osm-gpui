# Selection actions (`selection_actions::ACTIONS`): the right-click context
# menu, the Tools menu, and their status-bar messages. Each action id has a
# `label` (menu item) and a `hint` (shown when the selection doesn't fit).
action:
  no_data: "Open or download OSM data first"
  not_editable: "The active layer is not editable"
  edit_refused: "The edit could not be applied: %{detail}"
  square:
    label: "Square"
    hint: "Select a closed way (or a way with 3+ nodes) to square it"
    none: "No corners are close enough to 90° to square"
    done:
      one: "Squared %{count} way"
      other: "Squared %{count} ways"
  circularize:
    label: "Circularize"
    hint: "Select a closed way to circularize it"
    done:
      one: "Circularized %{count} way"
      other: "Circularized %{count} ways"
  reverse:
    label: "Reverse Way"
    hint: "Select a way to reverse it"
    done:
      one: "Reversed %{count} way"
      other: "Reversed %{count} ways"
    error:
      tag_too_long: "Can't reverse: flipping the tags of way %{way} would make a key or value longer than 255 characters"
  join:
    label: "Join Ways"
    hint: "Select two or more ways that connect end to end to join them"
    done:
      one: "Joined %{count} way"
      other: "Joined %{count} ways"
    error:
      not_chainable: "Can't join: the ways don't connect end to end in one chain"
      tag_conflict: "Can't join: the ways have different values for '%{key}'"
      needs_reversal: "Can't join: way %{id} would have to be reversed but its tags depend on its direction"
      restriction: "Can't join: way %{way} is part of turn restriction %{relation}"
      role_mismatch: "Can't join: way %{way} has a different role in relation %{relation} than the way it would be joined into"
      not_adjacent: "Can't join: way %{way} is not next to the way it would be joined into in relation %{relation}"
      not_in_area: "Can't join: way %{way} is part of multipolygon %{relation}, which does not contain the way it would be joined into"
  separate:
    label: "Separate Node"
    hint: "Select a node shared by two or more ways to separate it"
    node_missing: "The selected node is not in the active layer"
    done:
      one: "Separated a node into %{count} copy"
      other: "Separated a node into %{count} copies"
    error:
      restriction: "Can't separate: way %{way} is part of turn restriction %{relation}, which needs it to stay connected to the via node"
  unjoin:
    label: "Unjoin Node from Way"
    hint: "Select a node and a way it belongs to (and that another way shares) to give that way its own copy of the node"
    done: "Unjoined a node from a way"
    error:
      end_node: "Can't unjoin: the node is an end of the way, so there is nothing to pull it off (use Separate Node)"
      not_shared: "Can't unjoin: no other way uses the node"
  extract:
    label: "Extract Point"
    hint: "Select a closed way (such as a building) that has tags besides building and address to move them onto a new point"
    done:
      one: "Extracted %{count} point from a way"
      other: "Extracted %{count} points from ways"
  delete_segment:
    label: "Delete Way Segment"
    hint: "Select two nodes that are next to each other in a way to delete the segment between them"
    done: "Deleted a way segment"
    error:
      several_ways: "Can't delete the segment: several ways run along it, select the way too"
      twice: "Can't delete the segment: the way runs along it more than once"
      whole_way: "Can't delete the segment: it is all the way has, delete the way instead"
      restriction: "Can't delete the segment: way %{way} is part of turn restriction %{relation}, which needs it to stay connected to the via node"
  extend:
    label: "Extend Way"
    hint: "Select an open way, or the end node of one, to continue drawing it"
    started: "Click to add nodes to the way; Enter or Esc to finish"
  # Plural pieces of the Copy/Paste Tags status messages.
  tag_count:
    one: "%{count} tag"
    other: "%{count} tags"
  feature_count:
    one: "%{count} feature"
    other: "%{count} features"
  relation_count:
    one: "%{count} relation"
    other: "%{count} relations"
  copy_features:
    label: "Copy"
    hint: "Select nodes, ways or relations to copy"
    # `%{features}` is the count from `action.feature_count`.
    done: "Copied %{features}"
  paste_features:
    label: "Paste"
    hint: "Copy some features first, then paste them into a data layer"
    done: "Pasted %{features}"
    done_dropped:
      one: "Pasted %{features}; left out %{count} relation member that is not in this layer"
      other: "Pasted %{features}; left out %{count} relation members that are not in this layer"
  paste_features_source:
    label: "Paste at Source Position"
    hint: "Copy some features first, then paste them into a data layer"
  duplicate_features:
    label: "Duplicate"
    hint: "Select nodes, ways or relations to duplicate"
    done: "Duplicated %{features}"
    done_dropped:
      one: "Duplicated %{features}; left out %{count} relation member that is not in this layer"
      other: "Duplicated %{features}; left out %{count} relation members that are not in this layer"
  copy_tags:
    label: "Copy Tags"
    hint: "Select one feature that has tags to copy them"
    done: "Copied %{tags}"
  paste_tags:
    label: "Paste Tags"
    hint: "Copy a feature's tags first, then select what to paste them onto"
    none: "The selected features already have the copied tags"
    done: "Pasted %{tags} onto %{features}"
  split:
    label: "Split Way"
    hint: "Select one or more nodes inside a way (two or more nodes of a closed way) to split it"
    done:
      one: "Split %{count} way"
      other: "Split %{count} ways"
    error:
      restriction_via: "Can't split: can't tell which part of way %{way} belongs in turn restriction %{relation}"
  merge:
    label: "Merge Nodes"
    hint: "Select two or more nodes to merge them into one"
    done:
      one: "Merged %{count} node"
      other: "Merged %{count} nodes"
    error:
      tag_conflict: "Can't merge: the nodes have different values for '%{key}'"
      degenerate_way: "Can't merge: way %{id} would be left with fewer than two distinct nodes"
  straighten:
    label: "Straighten Way"
    hint: "Select an open way with 3 or more nodes to straighten it"
    none: "The selected ways are already straight"
    done:
      one: "Straightened %{count} way"
      other: "Straightened %{count} ways"
    error:
      too_curved: "Can't straighten: the way bends more than %{percent}% of its length"
      no_line: "Can't straighten: the way's first and last node are in the same place"
  simplify:
    label: "Simplify Way"
    hint: "Select one or more ways with 3 or more nodes to remove redundant nodes"
    none: "Nothing to simplify (tolerance %{tolerance} m)"
    done:
      one: "Simplified: removed %{count} node (tolerance %{tolerance} m)"
      other: "Simplified: removed %{count} nodes (tolerance %{tolerance} m)"
  rotate:
    label: "Rotate"
    hint: "Select a way, or two or more nodes, to rotate them around their center"
    status: "Rotating %{degrees}° · move the pointer around the selection · Shift snaps to 15° · click or Enter to apply · Esc to cancel"
    done: "Rotated %{degrees}°"
  align:
    label: "Align Nodes in Line"
    hint: "Select 3 or more nodes to put them on a straight line (select a way and use Straighten to align all of its nodes)"
    none: "The selected nodes are already in place"
    done:
      one: "Moved %{count} node"
      other: "Moved %{count} nodes"
    error:
      same_place: "Can't align: the outermost nodes are in the same place"
  distribute:
    label: "Distribute Nodes"
    hint: "Select 3 or more nodes to space them evenly between the outermost two"
    done:
      one: "Moved %{count} node"
      other: "Moved %{count} nodes"
  join_node_way:
    label: "Join Node to Way"
    hint: "Select one node and one way (that does not contain the node) to join them"
    done: "Joined a node to a way"
    error:
      in_way: "Can't join: the node is already part of that way"
  parallel:
    label: "Create Parallel Way…"
    hint: "Select one or more ways with at least two different nodes to copy them alongside"
    done:
      one: "Created %{count} parallel way"
      other: "Created %{count} parallel ways"
  add_to_relation:
    label: "Add to Relation…"
    hint: "Select nodes or ways in a layer that has relations to add them to one"
    # `%{features}` is the count from `action.feature_count`.
    done: "Added %{features} to relation %{relation}"
    already: "The selected features are already members of %{relation}"
  new_relation:
    label: "New Relation"
    hint: "Select nodes, ways or relations to put into a new relation"
    # `%{members}` is the count from `action.feature_count`.
    done: "Created a relation with %{members}. Add its tags and roles in the side panel"
  create_multipolygon:
    label: "Create Multipolygon"
    hint: "Select closed ways, or open ways that join into closed rings, to make a multipolygon"
    # `%{members}` is the count from `action.feature_count`.
    done: "Created a multipolygon with %{members} (%{outers} outer, %{inners} inner)"
    # `%{count}` ways were already members of another multipolygon.
    shared: "%{count} of the ways already belong to another multipolygon"
    degenerate: "Way %{way} is too short to be part of a ring"
    missing_node: "Node %{node} is not loaded, so the rings can't be checked"
    branching: "Three or more selected ways end at node %{node}; select only the ways that make the rings"
    unclosed: "The ways joined to way %{way} do not close into a ring"
    self_touching: "A ring passes through node %{node} twice"
    zero_area: "A selected ring has no area"
    crossing: "Ways %{first} and %{second} cross or overlap, which makes an invalid multipolygon"
  delete:
    label: "Delete"
    hint: "Select something to delete"
    # `%{what}` is the kind below, `%{id}` the OSM id.
    kind:
      node: "node"
      way: "way"
    error:
      relation_in_relation: "Can't delete relation %{relation}: it is a member of relation %{parent}"
      relation_empty: "Can't delete %{what} %{id}: it is the only member of relation %{relation}"
      restriction_role: "Can't delete %{what} %{id}: turn restriction %{relation} would be left without a '%{role}' member"
  purge:
    label: "Purge"
    hint: "Select something to purge from the layer"
    done:
      one: "Purged %{count} object from the layer"
      other: "Purged %{count} objects from the layer"
    kept: "%{done}; kept %{kept} node(s) that are still in use or edited"
    kind:
      node: "node"
      way: "way"
      relation: "relation"
    error:
      modified: "Can't purge %{what} %{id}: it has edits that are not uploaded. Upload or undo them first"
      in_way: "Can't purge node %{id}: way %{way} still uses it"

