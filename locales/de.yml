# Bearbeitungsmodi. `name` ist der Menüeintrag, `label` der kurze Text unter
# dem Symbol der schmalen Werkzeugleiste, `tooltip` die Hilfe beim Darüberfahren.
mode:
  select:
    name: "Auswählen"
    label: "Wahl"
    tooltip: "Objekte auswählen und verschieben"
  add:
    name: "Hinzufügen"
    label: "Neu"
    tooltip: "Knoten und Wege hinzufügen"
  building:
    name: "Gebäude"
    label: "Geb."
    tooltip: "Rechteckiges Gebäude zeichnen"
  extrude:
    name: "Ausziehen"
    label: "Ausz."
    tooltip: "Wegsegment ausziehen"
  # `%{shortcut}` ist die Taste, die den Modus aktiviert, z. B. „A“.
  tooltip: "%{name} (%{shortcut})"
  tooltip_disabled: "%{name} (%{shortcut}) — zuerst OSM-Daten öffnen oder herunterladen"

# Länger laufende Hintergrundvorgänge, in der Statusleiste mit Aktivitätsanzeige.
activity:
  uploading: "Änderungen werden hochgeladen …"
  downloading: "OSM-Daten werden heruntergeladen …"

status:
  # Einzeiliger Hinweis zu Maus und Tastatur im jeweiligen Modus.
  hint:
    select_empty: "Klicken zum Auswählen · Umschalt-Klick zum Ergänzen · Ziehen für Rahmenauswahl · Leertaste+Ziehen oder Rechtsziehen zum Verschieben der Karte"
    select_selection: "Auswahl ziehen zum Verschieben · Löschtaste zum Entfernen · Esc zum Abwählen"
    select_relation: "Relation gewählt: ihre Mitglieder sind hervorgehoben · Esc zum Abwählen"
    add_idle: "Klicken, um Knoten zu setzen oder Weg zu beginnen · Strg-Klick ohne Einrasten · Esc zum Beenden"
    add_started: "Klicken, um den Weg fortzusetzen · Enter oder Esc zum Abschließen"
    building_idle: "Klicken, um die erste Gebäudeecke zu setzen · Esc zum Beenden"
    building_started: "Klicken, um die zweite Ecke zu setzen · Esc zum Abbrechen"
    building_edge_placed: "Tiefe festlegen, dann klicken zum Abschließen · Esc zum Abbrechen"
    building_oriented_idle: "Klicken oder ziehen, um ein Gebäude am gewählten Weg auszurichten · Esc zum Beenden"
    building_oriented_started: "Klicken oder loslassen an der gegenüberliegenden Ecke zum Abschließen · Esc zum Abbrechen"
    extrude: "Wegsegment ziehen zum Ausziehen · Doppelklick auf Segment fügt Knoten ein · Esc zum Beenden"
  pending_edits:
    one: "%{count} ungesicherte Änderung"
    other: "%{count} ungesicherte Änderungen"
  not_signed_in: "Nicht angemeldet"
  zoom_in_to_download: "Zum Herunterladen näher heranzoomen"
  api_offline: "Die OSM-API meldet, dass sie offline ist; bitte später erneut versuchen"
  open_failed: "%{path} konnte nicht geöffnet werden: %{error}"
  open_data_first: "Zum Zeichnen zuerst OSM-Daten öffnen oder herunterladen"
  tag_needs_key: "Ein Tag braucht einen Schlüssel; die Änderung wurde verworfen"
  # Das Entfernen eines Mitglieds aus einer Relation wurde abgelehnt.
  member_remove:
    last: "Das letzte Mitglied der Relation %{relation} kann nicht entfernt werden"
    restriction_role: "Entfernen nicht möglich: Der Abbiegebeschränkung %{relation} würde ein Mitglied mit der Rolle '%{role}' fehlen"
  nothing_to_delete: "Nichts zu löschen"
  deleted_features:
    one: "%{count} Objekt gelöscht"
    other: "%{count} Objekte gelöscht"
  # `%{relations}` ist die Relationenzahl aus `action.relation_count`.
  deleted_features_in_relations:
    one: "%{count} Objekt gelöscht und aus %{relations} entfernt"
    other: "%{count} Objekte gelöscht und aus %{relations} entfernt"
  # Löschen, bei dem einige Objekte übersprungen wurden: was getan wurde, dann warum der Rest nicht.
  delete_skipped: "%{done}; %{reason}"
  no_data_to_zoom: "Keine OSM-Daten zum Zoomen"
  nothing_selected: "Nichts ausgewählt"
  no_data_to_export: "Keine OSM-Daten zum Exportieren"
  exported: "Exportiert nach %{path}"
  export_failed: "Export fehlgeschlagen: %{error}"
  nothing_to_upload: "Nichts hochzuladen"
  uploaded: "Änderungen hochgeladen (Änderungssatz %{changeset})"
  upload_failed_changeset_open: "%{error} (Änderungssatz %{changeset} wurde geöffnet, aber nicht hochgeladen — ggf. manuell schließen)"
  downloaded: "OSM-Daten heruntergeladen: %{summary}"
  # Die Teile der obigen Zusammenfassung, verbunden mit `separator`.
  merge:
    nothing_new: "nichts Neues"
    added:
      one: "%{count} neu"
      other: "%{count} neu"
    updated:
      one: "%{count} aktualisiert"
      other: "%{count} aktualisiert"
    kept_local:
      one: "%{count} lokale Änderung behalten"
      other: "%{count} lokale Änderungen behalten"
    separator: ", "

