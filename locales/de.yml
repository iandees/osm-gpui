  downloading: "Wird heruntergeladen …"
  # Ersetzt die Schaltfläche zum Herunterladen, solange der Ausschnitt zu groß ist.
  zoom_in: "Zum Herunterladen näher heranzoomen"
  open: "Datei öffnen …"
  # Kurzinfo der Schließen-Schaltfläche; der Kasten bleibt aus, bis er in den Einstellungen wieder eingeschaltet wird.
  dismiss: "Nicht mehr anzeigen (in den Einstellungen wieder einschaltbar)"

