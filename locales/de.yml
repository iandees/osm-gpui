# Auswahlaktionen (`selection_actions::ACTIONS`): Kontextmenü, Werkzeugmenü
# und ihre Statusmeldungen. Jede Aktion hat ein `label` (Menüeintrag) und
# einen `hint` (wird gezeigt, wenn die Auswahl nicht passt).
action:
  no_data: "Zuerst OSM-Daten öffnen oder herunterladen"
  not_editable: "Die aktive Ebene ist nicht bearbeitbar"
  square:
    label: "Rechtwinklig machen"
    hint: "Einen geschlossenen Weg (oder Weg mit 3+ Knoten) zum Rechtwinkligmachen wählen"
    none: "Keine Ecke liegt nah genug an 90° zum Rechtwinkligmachen"
    done:
      one: "%{count} Weg rechtwinklig gemacht"
      other: "%{count} Wege rechtwinklig gemacht"
  circularize:
    label: "Kreisförmig anordnen"
    hint: "Einen geschlossenen Weg zum kreisförmigen Anordnen wählen"
    done:
      one: "%{count} Weg kreisförmig angeordnet"
      other: "%{count} Wege kreisförmig angeordnet"
  reverse:
    label: "Weg umkehren"
    hint: "Einen Weg zum Umkehren wählen"
    done:
      one: "%{count} Weg umgekehrt"
      other: "%{count} Wege umgekehrt"
  join:
    label: "Wege verbinden"
    hint: "Zwei oder mehr Wege wählen, die Ende an Ende anschließen"
    done:
      one: "%{count} Weg verbunden"
      other: "%{count} Wege verbunden"
    error:
      not_chainable: "Verbinden nicht möglich: Die Wege bilden keine zusammenhängende Kette"
      tag_conflict: "Verbinden nicht möglich: Die Wege haben verschiedene Werte für „%{key}“"
      needs_reversal: "Verbinden nicht möglich: Weg %{id} müsste umgekehrt werden, aber seine Tags hängen von der Richtung ab"
      restriction: "Verbinden nicht möglich: Weg %{way} gehört zur Abbiegebeschränkung %{relation}"
      role_mismatch: "Verbinden nicht möglich: Weg %{way} hat in Relation %{relation} eine andere Rolle als der Weg, in den er verbunden würde"
  separate:
    label: "Knoten abtrennen"
    hint: "Einen Knoten wählen, der zu mehreren Wegen gehört, um ihn abzutrennen"
    node_missing: "Der gewählte Knoten liegt nicht in der aktiven Ebene"
    done:
      one: "Knoten in %{count} Kopie aufgetrennt"
      other: "Knoten in %{count} Kopien aufgetrennt"
  extend:
    label: "Weg verlängern"
    hint: "Einen offenen Weg oder dessen Endknoten wählen, um weiterzuzeichnen"
    started: "Klicken, um Knoten hinzuzufügen; Enter oder Esc zum Abschließen"
  # Pluralbausteine der Statusmeldungen von „Tags kopieren/einsetzen“.
  tag_count:
    one: "%{count} Tag"
    other: "%{count} Tags"
  feature_count:
    one: "%{count} Objekt"
    other: "%{count} Objekte"
  relation_count:
    one: "%{count} Relation"
    other: "%{count} Relationen"
  copy_tags:
    label: "Tags kopieren"
    hint: "Ein einzelnes Objekt mit Tags wählen, um sie zu kopieren"
    done: "%{tags} kopiert"
  paste_tags:
    label: "Tags einsetzen"
    hint: "Zuerst die Tags eines Objekts kopieren, dann die Zielobjekte wählen"
    none: "Die gewählten Objekte haben die kopierten Tags bereits"
    done: "%{tags} auf %{features} übertragen"
  split:
    label: "Weg teilen"
    hint: "Einen Knoten innerhalb eines Wegs (oder zwei Knoten eines geschlossenen Wegs) zum Teilen wählen"
    done:
      one: "%{count} Weg geteilt"
      other: "%{count} Wege geteilt"
    error:
      restriction_via: "Teilen nicht möglich: Es lässt sich nicht bestimmen, welcher Teil von Weg %{way} zur Abbiegebeschränkung %{relation} gehört"
  merge:
    label: "Knoten vereinigen"
    hint: "Zwei oder mehr Knoten wählen, um sie zu einem zu vereinigen"
    done:
      one: "%{count} Knoten vereinigt"
      other: "%{count} Knoten vereinigt"
    error:
      tag_conflict: "Vereinigen nicht möglich: Die Knoten haben verschiedene Werte für „%{key}“"
      degenerate_way: "Vereinigen nicht möglich: Weg %{id} hätte danach weniger als zwei verschiedene Knoten"
  straighten:
    label: "Weg begradigen"
    hint: "Einen offenen Weg mit 3 oder mehr Knoten zum Begradigen wählen"
    none: "Die gewählten Wege sind bereits gerade"
    done:
      one: "%{count} Weg begradigt"
      other: "%{count} Wege begradigt"
    error:
      too_curved: "Begradigen nicht möglich: Der Weg weicht um mehr als %{percent} % seiner Länge ab"
      no_line: "Begradigen nicht möglich: Erster und letzter Knoten des Wegs liegen an derselben Stelle"
  add_to_relation:
    label: "Zu Relation hinzufügen …"
    hint: "Knoten oder Wege in einer Ebene mit Relationen wählen, um sie einer Relation hinzuzufügen"
    # `%{features}` ist die Zahl aus `action.feature_count`.
    done: "%{features} zur Relation %{relation} hinzugefügt"
    already: "Die gewählten Objekte sind bereits Mitglieder von %{relation}"
  delete:
    label: "Löschen"
    hint: "Etwas zum Löschen auswählen"
    relation_hint: "Relationen können noch nicht gelöscht werden"
    # `%{what}` ist die Art unten, `%{id}` die OSM-ID.
    kind:
      node: "Knoten"
      way: "Weg"
    error:
      relation_empty: "%{what} %{id} kann nicht gelöscht werden: Er ist das einzige Mitglied der Relation %{relation}"
      restriction_role: "%{what} %{id} kann nicht gelöscht werden: Der Abbiegebeschränkung %{relation} würde das Mitglied mit der Rolle „%{role}“ fehlen"

