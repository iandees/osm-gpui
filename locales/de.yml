# Größenlimits des OSM-Servers (Knoten pro Weg, Mitglieder pro Relation,
# Elemente pro Änderungssatz). Zahlen kommen bereits mit Tausendertrennung an.
limits:
  upload:
    way: "Weg %{id} hat %{nodes} Knoten; der Server erlaubt %{max}. Vor dem Hochladen aufteilen."
    relation: "Relation %{id} hat %{members} Mitglieder; der Server erlaubt %{max}. Vor dem Hochladen einige Mitglieder entfernen."
  edit:
    way_full: "Ein Weg darf auf diesem Server höchstens %{max} Knoten haben"
    join: "Verbinden nicht möglich: der gemeinsame Weg hätte %{nodes} Knoten; der Server erlaubt %{max}"
    relation_add: "Hinzufügen nicht möglich: die Relation hätte %{members} Mitglieder; der Server erlaubt %{max}"
    relation_new: "Relation kann nicht erstellt werden: %{members} Mitglieder sind mehr als der Server erlaubt (%{max})"

# Abschnitte der Seitenleiste. Vorlagen- und Feldbezeichnungen darin stammen
# aus dem mitgelieferten iD-Tagging-Schema und werden hier nicht übersetzt.
panel:
  layers:
    title: "Ebenen"
    empty: "Noch keine Ebenen"
    # Markierung der Ebene, in die die Zeichenmodi schreiben.
    editing: "aktiv"
    set_active: "Als aktive Ebene festlegen"
    move_up: "Nach oben"
    move_down: "Nach unten"
    hide: "Ausblenden"
    show: "Einblenden"
    delete: "Löschen"
  selection:
    title: "Auswahl"
    title_count:
      one: "Auswahl (%{count} Element)"
      other: "Auswahl (%{count} Elemente)"
    nothing: "Nichts ausgewählt"
    nothing_hint: "Ein Objekt anklicken oder mit einem Rahmen mehrere auswählen."
    node: "Knoten"
    way: "Weg"
    relation: "Relation"
    # `%{kind}` ist die Bezeichnung Knoten/Weg/Relation oben, `%{id}` die OSM-ID.
    row: "%{kind} %{id}"
    row_named: "%{name} · %{kind} %{id}"
    # Eine sehr große Auswahl listet nur die ersten `%{shown}` Objekte auf;
    # `%{count}` ist die Zahl der nicht aufgelisteten.
    more:
      one: "…und %{count} weiteres (die ersten %{shown} aufgelistet)"
      other: "…und %{count} weitere (die ersten %{shown} aufgelistet)"
  fields:
    title: "Felder"
    change_type: "Objekttyp ändern …"
    no_preset: "Keine passende Vorlage."
    no_fields: "Dieser Objekttyp hat keine bearbeitbaren Felder."
    add_field: "Feld hinzufügen (%{count})"
    # Öffnet die Wertliste eines Mehrfachauswahlfelds.
    multi_add: "+ Hinzufügen"
    # Anzeige in einem Auswahlfeld ohne gesetzten Wert.
    none: "(keine)"
  tags:
    title: "Tags"
    add: "Tag hinzufügen"
    empty: "(keine Tags)"
    # Mehr als `%{limit}` Objekte ausgewählt: ihre Tags werden nicht zusammengeführt.
    too_many:
      one: "%{count} Objekt ausgewählt: zu viele, um gemeinsame Tags anzuzeigen (Grenze %{limit})"
      other: "%{count} Objekte ausgewählt: zu viele, um gemeinsame Tags anzuzeigen (Grenze %{limit})"
    key_placeholder: "Schlüssel"
    value_placeholder: "Wert"
  relations:
    title: "Relationen"
    no_role: "(keine Rolle)"
    remove: "Aus dieser Relation entfernen"
    # Ein Mitglied der Relation, das nicht in den geladenen Daten liegt.
    not_downloaded: "%{kind} %{id} (nicht heruntergeladen)"
  members:
    title_count:
      one: "Mitglieder (%{count})"
      other: "Mitglieder (%{count})"
    empty: "(keine Mitglieder)"
    # Platzhalter im Rolleneingabefeld.
    role: "Rolle"
    move_up: "Nach oben"
    move_down: "Nach unten"
    remove: "Aus Relation entfernen"
    show_all: "Alle %{count} anzeigen"
  history:
    title: "Verlauf"
    empty: "Noch keine Aktionen."

