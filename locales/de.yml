  straighten:
    label: "Weg begradigen"
    hint: "Einen offenen Weg mit 3 oder mehr Knoten zum Begradigen wählen"
    none: "Die gewählten Wege sind bereits gerade"
    done:
      one: "%{count} Weg begradigt"
      other: "%{count} Wege begradigt"
    error:
