    shared: "%{count} der Wege gehören bereits zu einem anderen Multipolygon"
    degenerate: "Weg %{way} ist zu kurz für einen Ring"
    missing_node: "Knoten %{node} ist nicht geladen, die Ringe können nicht geprüft werden"
    branching: "Drei oder mehr gewählte Wege enden an Knoten %{node}; nur die Wege der Ringe wählen"
    unclosed: "Die mit Weg %{way} verbundenen Wege schließen sich nicht zu einem Ring"
    self_touching: "Ein Ring läuft zweimal durch Knoten %{node}"
    zero_area: "Ein gewählter Ring hat keine Fläche"
    crossing: "Die Wege %{first} und %{second} kreuzen oder überlappen sich, das ergibt ein ungültiges Multipolygon"
  delete:
    label: "Löschen"
    hint: "Etwas zum Löschen auswählen"
    # `%{what}` ist die Art unten, `%{id}` die OSM-ID.
    kind:
      node: "Knoten"
