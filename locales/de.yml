# Bearbeitungsmodi. `name` ist der Menüeintrag, `label` der kurze Text unter
# dem Symbol der schmalen Werkzeugleiste, `tooltip` die Hilfe beim Darüberfahren.
mode:
  select:
    name: "Auswählen"
    label: "Wahl"
    tooltip: "Objekte auswählen und verschieben"
  add:
    name: "Hinzufügen"
    label: "Neu"
    tooltip: "Knoten und Wege hinzufügen"
  building:
    name: "Gebäude"
    label: "Geb."
    tooltip: "Rechteckiges Gebäude zeichnen"
  extrude:
    name: "Ausziehen"
    label: "Ausz."
    tooltip: "Wegsegment ausziehen"
  # `%{shortcut}` ist die Taste, die den Modus aktiviert, z. B. „A“.
  tooltip: "%{name} (%{shortcut})"
  tooltip_disabled: "%{name} (%{shortcut}) — zuerst OSM-Daten öffnen oder herunterladen"

# Länger laufende Netzwerkübertragungen, in der Statusleiste (und beim Hochladen
# im Hochlade-Dialog) mit Aktivitätsanzeige.
transfer:
  # `%{size}` und `%{total}` sind Bytemengen wie „1.4 MB“.
  download:
    requesting: "OSM-Daten werden angefordert …"
    downloading: "OSM-Daten werden heruntergeladen …"
    downloading_bytes: "OSM-Daten werden heruntergeladen … %{size}"
    downloading_total: "OSM-Daten werden heruntergeladen … %{size} von %{total}"
    reading: "OSM-Daten werden eingelesen …"
    cancel: "Abbrechen"
    cancelled: "Herunterladen abgebrochen"
  upload:
    opening: "Änderungssatz wird geöffnet …"
    uploading:
      one: "%{count} Änderung wird hochgeladen …"
      other: "%{count} Änderungen werden hochgeladen …"
    closing: "Änderungssatz wird geschlossen …"
    part_opening: "Änderungssatz %{index} von %{total}: wird geöffnet …"
    part_uploading:
      one: "Änderungssatz %{index} von %{total}: %{changes} Änderung wird hochgeladen …"
      other: "Änderungssatz %{index} von %{total}: %{changes} Änderungen werden hochgeladen …"
    part_closing: "Änderungssatz %{index} von %{total}: wird geschlossen …"
  busy: "Es läuft bereits eine andere Übertragung"
  waiting_keychain: "Warte auf Zugriff auf die gespeicherte Anmeldung … (auf eine Schlüsselbund-Abfrage achten)"

# Das Feld über der Karte beim Anpassen des Versatzes einer Bildebene. Werte
# in Metern nach Osten und Norden, mit zwei Nachkommastellen.
imagery_offset:
  title: "Luftbildversatz anpassen"
  value: "O %{east} m, N %{north} m"
  east: "Ost"
  north: "Nord"
  metres: "m"
  hint: "Die Karte ziehen, um das Luftbild zu verschieben. Pfeiltasten schieben um 1 px (Umschalt: 10 px). Esc bricht ab."
  reset: "Zurücksetzen"
  done: "Fertig"
  no_layer: "Es gibt keine sichtbare Bildebene zum Anpassen"
  reset_done: "Luftbildversatz zurückgesetzt"

