# Fehler der OSM-API und des OAuth-Codes, in Statusleiste und Einstellungen.
# `%{detail}` ist die Meldung des Servers bzw. der Netzwerkschicht und wird
# nicht übersetzt.
# Ein großer Upload wird auf mehrere Änderungssätze aufgeteilt.
upload_chunks:
  cycle_too_large: "%{size} neue Relationen enthalten sich gegenseitig und müssen zusammen hochgeladen werden, aber der Server erlaubt nur %{max} Änderungen pro Änderungssatz. Löse den Zyklus auf, bevor du hochlädst."

# Was die Ablehnung eines Uploads durch den Server bedeutet und was das
# Auflösen bewirkt (maschinell vorübersetzt). `%{object}` ist „Knoten 12345“ /
# „Weg 5“ / „Relation 7“ (oder `something`, wenn der Server nichts nennt).
