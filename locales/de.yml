    done:
      one: "%{count} Knoten verschoben"
      other: "%{count} Knoten verschoben"
    error:
      same_place: "Ausrichten nicht möglich: Die äußersten Knoten liegen an derselben Stelle"
  distribute:
    label: "Knoten gleichmäßig verteilen"
    hint: "3 oder mehr Knoten wählen, um sie gleichmäßig zwischen den äußersten beiden zu verteilen"
    done:
      one: "%{count} Knoten verschoben"
      other: "%{count} Knoten verschoben"
  join_node_way:
    label: "Knoten mit Weg verbinden"
    hint: "Einen Knoten und einen Weg wählen (der den Knoten noch nicht enthält), um sie zu verbinden"
    done: "Knoten mit Weg verbunden"
    error:
      in_way: "Verbinden nicht möglich: Der Knoten gehört bereits zu diesem Weg"
  parallel:
    label: "Parallelen Weg erstellen …"
    hint: "Einen oder mehrere Wege mit mindestens zwei verschiedenen Knoten wählen, um sie daneben zu kopieren"
    done:
      one: "%{count} parallelen Weg erstellt"
      other: "%{count} parallele Wege erstellt"
  add_to_relation:
    label: "Zu Relation hinzufügen …"
    hint: "Knoten oder Wege in einer Ebene mit Relationen wählen, um sie einer Relation hinzuzufügen"
