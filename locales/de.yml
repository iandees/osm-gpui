    done: "Relation mit %{members} erstellt. Tags und Rollen im Seitenbereich ergänzen"
  create_multipolygon:
    label: "Multipolygon erstellen"
    hint: "Geschlossene Wege oder offene Wege, die sich zu geschlossenen Ringen verbinden, wählen, um ein Multipolygon zu erstellen"
