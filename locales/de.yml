# Auswahlaktionen (`selection_actions::ACTIONS`): Kontextmenü, Werkzeugmenü
# und ihre Statusmeldungen. Jede Aktion hat ein `label` (Menüeintrag) und
# einen `hint` (wird gezeigt, wenn die Auswahl nicht passt).
action:
  no_data: "Zuerst OSM-Daten öffnen oder herunterladen"
  not_editable: "Die aktive Ebene ist nicht bearbeitbar"
  square:
    label: "Rechtwinklig machen"
    hint: "Einen geschlossenen Weg (oder Weg mit 3+ Knoten) zum Rechtwinkligmachen wählen"
    none: "Keine Ecke liegt nah genug an 90° zum Rechtwinkligmachen"
    done:
      one: "%{count} Weg rechtwinklig gemacht"
      other: "%{count} Wege rechtwinklig gemacht"
  circularize:
    label: "Kreisförmig anordnen"
    hint: "Einen geschlossenen Weg zum kreisförmigen Anordnen wählen"
    done:
      one: "%{count} Weg kreisförmig angeordnet"
      other: "%{count} Wege kreisförmig angeordnet"
  reverse:
    label: "Weg umkehren"
    hint: "Einen Weg zum Umkehren wählen"
    done:
      one: "%{count} Weg umgekehrt"
      other: "%{count} Wege umgekehrt"
    error:
      tag_too_long: "Umkehren nicht möglich: Das Vertauschen der Tags von Weg %{way} ergäbe einen Schlüssel oder Wert mit mehr als 255 Zeichen"
  join:
    label: "Wege verbinden"
    hint: "Zwei oder mehr Wege wählen, die Ende an Ende anschließen"
    done:
      one: "%{count} Weg verbunden"
      other: "%{count} Wege verbunden"
    error:
      not_chainable: "Verbinden nicht möglich: Die Wege bilden keine zusammenhängende Kette"
      tag_conflict: "Verbinden nicht möglich: Die Wege haben verschiedene Werte für „%{key}“"
      needs_reversal: "Verbinden nicht möglich: Weg %{id} müsste umgekehrt werden, aber seine Tags hängen von der Richtung ab"
      restriction: "Verbinden nicht möglich: Weg %{way} gehört zur Abbiegebeschränkung %{relation}"
      role_mismatch: "Verbinden nicht möglich: Weg %{way} hat in Relation %{relation} eine andere Rolle als der Weg, in den er verbunden würde"
      not_adjacent: "Verbinden nicht möglich: Weg %{way} liegt in Relation %{relation} nicht neben dem Weg, in den er verbunden würde"
      not_in_area: "Verbinden nicht möglich: Weg %{way} gehört zum Multipolygon %{relation}, das den Weg, in den er verbunden würde, nicht enthält"
  separate:
    label: "Knoten abtrennen"
    hint: "Einen Knoten wählen, der zu mehreren Wegen gehört, um ihn abzutrennen"
    node_missing: "Der gewählte Knoten liegt nicht in der aktiven Ebene"
    done:
      one: "Knoten in %{count} Kopie aufgetrennt"
      other: "Knoten in %{count} Kopien aufgetrennt"
    error:
      restriction: "Abtrennen nicht möglich: Weg %{way} gehört zur Abbiegebeschränkung %{relation}, die ihn am Via-Knoten braucht"
  unjoin:
    label: "Knoten vom Weg lösen"
    hint: "Einen Knoten und einen Weg wählen, zu dem er gehört (und den ein anderer Weg mitnutzt), damit dieser Weg eine eigene Kopie des Knotens bekommt"
    done: "Knoten von einem Weg gelöst"
    error:
      end_node: "Lösen nicht möglich: Der Knoten ist ein Ende des Weges, es gibt nichts abzulösen (Knoten abtrennen verwenden)"
      not_shared: "Lösen nicht möglich: Kein anderer Weg nutzt den Knoten"
  delete_segment:
    label: "Wegsegment löschen"
    hint: "Zwei benachbarte Knoten eines Weges wählen, um das Segment dazwischen zu löschen"
    done: "Wegsegment gelöscht"
    error:
      several_ways: "Segment löschen nicht möglich: Mehrere Wege verlaufen dort, den Weg zusätzlich wählen"
      twice: "Segment löschen nicht möglich: Der Weg verläuft mehrfach über das Segment"
      whole_way: "Segment löschen nicht möglich: Es ist alles, was der Weg hat, stattdessen den Weg löschen"
      restriction: "Segment löschen nicht möglich: Weg %{way} gehört zur Abbiegebeschränkung %{relation}, die ihn am Via-Knoten braucht"
  extend:
    label: "Weg verlängern"
    hint: "Einen offenen Weg oder dessen Endknoten wählen, um weiterzuzeichnen"
    started: "Klicken, um Knoten hinzuzufügen; Enter oder Esc zum Abschließen"
  # Pluralbausteine der Statusmeldungen von „Tags kopieren/einsetzen“.
  tag_count:
    one: "%{count} Tag"
    other: "%{count} Tags"
  feature_count:
    one: "%{count} Objekt"
    other: "%{count} Objekte"
  relation_count:
    one: "%{count} Relation"
    other: "%{count} Relationen"
  copy_features:
    label: "Kopieren"
    hint: "Knoten, Wege oder Relationen zum Kopieren wählen"
    done: "%{features} kopiert"
  paste_features:
    label: "Einsetzen"
    hint: "Zuerst Objekte kopieren, dann in eine Datenebene einsetzen"
    done: "%{features} eingesetzt"
    done_dropped:
      one: "%{features} eingesetzt; %{count} Relationsmitglied ausgelassen, das nicht in dieser Ebene ist"
      other: "%{features} eingesetzt; %{count} Relationsmitglieder ausgelassen, die nicht in dieser Ebene sind"
  paste_features_source:
    label: "An Ursprungsposition einsetzen"
    hint: "Zuerst Objekte kopieren, dann in eine Datenebene einsetzen"
  duplicate_features:
    label: "Duplizieren"
    hint: "Knoten, Wege oder Relationen zum Duplizieren wählen"
    done: "%{features} dupliziert"
    done_dropped:
      one: "%{features} dupliziert; %{count} Relationsmitglied ausgelassen, das nicht in dieser Ebene ist"
      other: "%{features} dupliziert; %{count} Relationsmitglieder ausgelassen, die nicht in dieser Ebene sind"
  copy_tags:
    label: "Tags kopieren"
    hint: "Ein einzelnes Objekt mit Tags wählen, um sie zu kopieren"
    done: "%{tags} kopiert"
  paste_tags:
    label: "Tags einsetzen"
    hint: "Zuerst die Tags eines Objekts kopieren, dann die Zielobjekte wählen"
    none: "Die gewählten Objekte haben die kopierten Tags bereits"
    done: "%{tags} auf %{features} übertragen"
  split:
    label: "Weg teilen"
    hint: "Einen oder mehrere Knoten innerhalb eines Wegs (zwei oder mehr Knoten eines geschlossenen Wegs) zum Teilen wählen"
