    key_placeholder: "Schlüssel"
    value_placeholder: "Wert"
  relations:
    title: "Relationen"
    no_role: "(keine Rolle)"
    remove: "Aus dieser Relation entfernen"
    # Ein Mitglied der Relation, das nicht in den geladenen Daten liegt.
    not_downloaded: "%{kind} %{id} (nicht heruntergeladen)"
  members:
    title_count:
      one: "Mitglieder (%{count})"
      other: "Mitglieder (%{count})"
    empty: "(keine Mitglieder)"
    # Platzhalter im Rolleneingabefeld.
    role: "Rolle"
    move_up: "Nach oben"
    move_down: "Nach unten"
    remove: "Aus Relation entfernen"
    show_all: "Alle %{count} anzeigen"
