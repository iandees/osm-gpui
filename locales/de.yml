      other: "%{count} Wege kreisförmig angeordnet"
  reverse:
    label: "Weg umkehren"
    hint: "Einen Weg zum Umkehren wählen"
    done:
      one: "%{count} Weg umgekehrt"
      other: "%{count} Wege umgekehrt"
